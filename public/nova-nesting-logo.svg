<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">NOVA AI NESTING</title><desc id="desc">Chrome and electric-blue NOVA NESTING logo on a transparent background.</desc>
<defs>
